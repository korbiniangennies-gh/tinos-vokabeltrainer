name: Vokabeln aktualisieren

# Wenn daten/vokabeln_greenline1.csv geändert wird (z.B. am Handy über github.com),
# wird der Datenblock in index.html automatisch neu erzeugt und committet.
on:
  push:
    branches: [main]
    paths: ["daten/**", "tools/build_vocab.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_vocab.py
      - name: Änderungen committen
        run: |
          if git diff --quiet; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add index.html daten/vokabeln_greenline1.csv
          git commit -m "Vokabeln aus CSV aktualisiert"
          git push
